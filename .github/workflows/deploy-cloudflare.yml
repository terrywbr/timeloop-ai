name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-timeloop-ai
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Verify Node.js version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Create production env file for OpenNext runtime
        run: |
          cat > .env.production << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_SITE_URL=${{ secrets.NEXT_PUBLIC_APP_SITE_URL }}
          NEXT_PUBLIC_CN_SITE_URL=${{ secrets.NEXT_PUBLIC_CN_SITE_URL }}
          NEXT_PUBLIC_STREAM_PROXY_URL=${{ secrets.NEXT_PUBLIC_STREAM_PROXY_URL }}
          NEXT_PUBLIC_CN_WECHAT_SUPPORT_ID=${{ secrets.NEXT_PUBLIC_CN_WECHAT_SUPPORT_ID }}
          EOF

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_SITE_URL: ${{ secrets.NEXT_PUBLIC_APP_SITE_URL }}
          NEXT_PUBLIC_CN_SITE_URL: ${{ secrets.NEXT_PUBLIC_CN_SITE_URL }}
          NEXT_PUBLIC_STREAM_PROXY_URL: ${{ secrets.NEXT_PUBLIC_STREAM_PROXY_URL }}
          NEXT_PUBLIC_CN_WECHAT_SUPPORT_ID: ${{ secrets.NEXT_PUBLIC_CN_WECHAT_SUPPORT_ID }}

      - name: Deploy to Cloudflare Workers
        run: |
          npx wrangler deploy \
            --var "NEXT_PUBLIC_SUPABASE_URL:${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --var "NEXT_PUBLIC_SUPABASE_ANON_KEY:${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --var "NEXT_PUBLIC_SITE_URL:${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
            --var "NEXT_PUBLIC_APP_SITE_URL:${{ secrets.NEXT_PUBLIC_APP_SITE_URL }}" \
            --var "NEXT_PUBLIC_CN_SITE_URL:${{ secrets.NEXT_PUBLIC_CN_SITE_URL }}" \
            --var "NEXT_PUBLIC_STREAM_PROXY_URL:${{ secrets.NEXT_PUBLIC_STREAM_PROXY_URL }}" \
            --var "NEXT_PUBLIC_CN_WECHAT_SUPPORT_ID:${{ secrets.NEXT_PUBLIC_CN_WECHAT_SUPPORT_ID || '' }}" \
            --var "LEMON_SQUEEZY_STORE_ID:261374" \
            --var "LEMON_SQUEEZY_VIP_VARIANT_ID:1752571" \
            --var "LEMON_SQUEEZY_CREDIT_PACK_VARIANT_ID:1752612" \
            --var "LEMON_SQUEEZY_CREDIT_PACK_CREDITS:${{ secrets.LEMON_SQUEEZY_CREDIT_PACK_CREDITS || '100' }}" \
            --var "LEMON_SQUEEZY_STREAMER_VARIANT_ID:1771738"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Worker secrets
        run: |
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          }
          sync_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          sync_secret TOGETHER_API_KEY "$TOGETHER_API_KEY"
          sync_secret REPLICATE_API_TOKEN "$REPLICATE_API_TOKEN"
          sync_secret LEMON_SQUEEZY_API_KEY "$LEMON_SQUEEZY_API_KEY"
          sync_secret LEMON_SQUEEZY_WEBHOOK_SECRET "$LEMON_SQUEEZY_WEBHOOK_SECRET"
          sync_secret DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
          sync_secret ADMIN_API_SECRET "$ADMIN_API_SECRET"
          sync_secret OPENAI_API_KEY "$OPENAI_API_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
          LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy stream proxy Worker
        run: npx wrangler deploy -c wrangler.stream.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
